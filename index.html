<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whale Shark 3D | Impresión 3D Personalizada</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --abisal: #041526;
      --oceano: #0A2A43;
      --turquesa: #00E5FF;
      --espuma: #F0F8FF;
      --turquesa-dim: rgba(0, 229, 255, 0.15);
      --glass: rgba(10, 42, 67, 0.72);
      --glass-border: rgba(0, 229, 255, 0.25);
      --sombra: 0 8px 32px rgba(0, 0, 0, 0.35);
      --radio: 16px;
      --trans: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--abisal);
      color: var(--espuma);
      line-height: 1.6;
      overflow-x: hidden;
    }
    h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; font-weight: 700; }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    button, input, select, textarea { font-family: inherit; }

    .container { width: min(1200px, 92%); margin-inline: auto; position: relative; z-index: 2; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.85rem 1.6rem; border: none; border-radius: 999px;
      font-weight: 600; font-size: 0.95rem; cursor: pointer;
      transition: var(--trans);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--turquesa), #00b8d4);
      color: var(--abisal); box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0, 229, 255, 0.5); }
    .btn-outline {
      background: transparent; border: 1.5px solid var(--turquesa);
      color: var(--turquesa);
    }
    .btn-outline:hover { background: var(--turquesa-dim); }
    .btn-ghost { background: transparent; color: var(--espuma); border: 1px solid transparent; }
    .btn-ghost:hover { border-color: var(--glass-border); background: var(--turquesa-dim); }
    .section { padding: 5rem 0; position: relative; overflow: hidden; }
    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem); text-align: center;
      margin-bottom: 0.5rem; letter-spacing: -0.02em;
    }
    .section-sub {
      text-align: center; color: rgba(240, 248, 255, 0.75);
      max-width: 560px; margin: 0 auto 3rem; font-size: 1.05rem;
    }

    /* Fondo decorativo marino con tu primera imagen */
    .marine-pattern {
      position: relative;
    }
    .marine-pattern::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('patron-mar.png');
      background-size: 420px auto;
      background-repeat: repeat;
      opacity: 0.055;
      filter: invert(1) sepia(1) saturate(5) hue-rotate(155deg);
      pointer-events: none;
      z-index: 0;
    }

    /* Tarjetas Glass con esquinas estilo filamento 3D */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 229, 255, 0.18);
      border-radius: var(--radio);
      position: relative;
    }
    .filament-card {
      position: relative;
    }
    .filament-card::before,
    .filament-card::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 4;
      transition: var(--trans);
      border-color: var(--turquesa);
      border-style: solid;
      filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.65));
    }
    /* Esquina superior izquierda tipo filamento extruido */
    .filament-card::before {
      top: -1px;
      left: -1px;
      border-width: 3px 0 0 3px;
      border-top-left-radius: var(--radio);
    }
    /* Esquina inferior derecha tipo filamento extruido */
    .filament-card::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 3px 3px 0;
      border-bottom-right-radius: var(--radio);
    }
    .filament-card:hover::before,
    .filament-card:hover::after {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 0 10px var(--turquesa));
    }
    /* Puntos de nodo de filamento en las esquinas */
    .filament-corners {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }
    .filament-corners::before,
    .filament-corners::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: rgba(0, 229, 255, 0.55);
      border-style: solid;
      transition: var(--trans);
    }
    .filament-corners::before {
      top: -1px;
      right: -1px;
      border-width: 2px 2px 0 0;
      border-top-right-radius: var(--radio);
    }
    .filament-corners::after {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 2px 2px;
      border-bottom-left-radius: var(--radio);
    }
    .filament-card:hover .filament-corners::before,
    .filament-card:hover .filament-corners::after {
      border-color: var(--turquesa);
      width: 30px;
      height: 30px;
    }

    /* Mascotas recortadas desde la Plantilla 3 (5 columnas x 3 filas) */
    .mascot-sprite {
      background-image: url('mascotas.png');
      background-size: 500% 300%;
      background-repeat: no-repeat;
      border-radius: 18px;
      filter: drop-shadow(0 8px 20px rgba(0, 229, 255, 0.25));
      flex-shrink: 0;
    }
    /* Fila 1, Col 1: Saludando */
    .mascot-wave { background-position: 0% 0%; }
    /* Fila 1, Col 3: Con impresora 3D */
    .mascot-printer { background-position: 50% 0%; }
    /* Fila 2, Col 1: Con laptop/diseño */
    .mascot-laptop { background-position: 0% 50%; }
    /* Fila 2, Col 4: Con caja de envío */
    .mascot-box { background-position: 75% 50%; }

    .section-mascot-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }
    .section-mascot-header .mascot-badge {
      width: 96px;
      height: 96px;
      background-color: #ffffff;
      border: 2px solid var(--turquesa);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    .bubbles {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .bubble {
      position: absolute; bottom: -40px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(0,229,255,0.35), rgba(0,229,255,0.05));
      animation: rise linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 0.75rem 0; transition: var(--trans);
      background: transparent;
    }
    header.scrolled {
      background: rgba(4, 21, 38, 0.94); backdrop-filter: blur(12px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
      border-bottom: 1px solid rgba(0, 229, 255, 0.15);
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1.5rem;
    }
    .logo {
      display: flex; align-items: center; gap: 0.75rem;
      font-family: 'Montserrat', sans-serif; font-weight: 800;
      font-size: 1.15rem; letter-spacing: -0.03em;
    }
    .logo-img-wrap {
      width: 48px; height: 48px; border-radius: 50%;
      background: #ffffff; padding: 3px;
      display: grid; place-items: center;
      border: 2px solid var(--turquesa);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
      overflow: hidden; flex-shrink: 0;
    }
    .logo-img-wrap img {
      width: 100%; height: 100%; object-fit: contain;
    }
    .nav-links {
      display: flex; align-items: center; gap: 0.3rem; list-style: none;
    }
    .nav-links a {
      padding: 0.5rem 0.9rem; border-radius: 8px; font-size: 0.9rem;
      font-weight: 500; color: rgba(240,248,255,0.85); transition: var(--trans);
    }
    .nav-links a:hover { color: var(--turquesa); background: var(--turquesa-dim); }
    .nav-actions { display: flex; align-items: center; gap: 0.6rem; }
    .admin-btn {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--glass-border);
      background: var(--glass); color: var(--espuma); cursor: pointer;
      display: grid; place-items: center; transition: var(--trans);
    }
    .admin-btn:hover, .admin-btn.active { border-color: var(--turquesa); color: var(--turquesa); box-shadow: 0 0 12px rgba(0,229,255,0.4); }
    .menu-toggle {
      display: none; width: 40px; height: 40px; border: none;
      background: transparent; color: var(--espuma); cursor: pointer;
    }

    .hero {
      min-height: 100vh; display: flex; align-items: center;
      position: relative; padding-top: 90px; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(0,229,255,0.14), transparent),
        radial-gradient(ellipse 50% 40% at 80% 20%, rgba(10,42,67,0.85), transparent),
        linear-gradient(180deg, var(--abisal) 0%, var(--oceano) 100%);
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 2rem;
    }
    .hero-content { position: relative; z-index: 2; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.35rem 0.9rem; border-radius: 999px;
      background: var(--turquesa-dim); border: 1px solid var(--glass-border);

.example-meta span {

}
.colors-grid {

gap: 1.2rem;
}
.color-card {
text-align: center; padding: 1.3rem 0.8rem; transition: var(--trans);
}
.color-card:hover { transform: translateY(-4px); border-color: var(--turquesa); }
.color-sphere {

.form-actions { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 0.5rem; }

text-align: center;
cursor: pointer;
transition: var(--trans);
background: rgba(4,21,38,0.4);

}

}

}

} 
.modal-overlay.open { display: flex; } 
.modal { 
background: var(--oceano); border: 1px solid var(--turquesa); 
border-radius: var(--radio); padding: 2rem; max-width: 400px; width: 100%;

border: 1px solid var(--glass-border); background: var(--abisal);

}

.toast { 
position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); 
background: var(--oceano); border: 1px solid var(--turquesa);

function initStlViewer() {
const canvas = document.getElementById("stlViewer");
if (!canvas || typeof THREE === "undefined") return;
const width = canvas.clientWidth || 400;
const height = 260;
stlScene = new THREE.Scene();
stlScene.background = new THREE.Color(0x020e18);
stlCamera = new THREE.PerspectiveCamera(45, width / height, 0.1, 2000);
stlCamera.position.set(0, 0, 100);
stlRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
stlRenderer.setSize(width, height);
stlRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
stlScene.add(ambient);
const dir1 = new THREE.DirectionalLight(0x00e5ff, 0.85);
dir1.position.set(1, 1, 1);
stlScene.add(dir1);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
dir2.position.set(-1, -0.5, -1);
stlScene.add(dir2);
canvas.addEventListener("mousedown", e => {
stlControls.isDragging = true;
stlControls.previousMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener("mouseup", () => stlControls.isDragging = false);
canvas.addEventListener("mousemove", e => {
if (!stlControls.isDragging || !stlMesh) return;
const dx = e.clientX - stlControls.previousMouse.x;
const dy = e.clientY - stlControls.previousMouse.y;
stlControls.rotation.y += dx * 0.01;
stlControls.rotation.x += dy * 0.01;
stlControls.previousMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("touchstart", e => {
if (e.touches.length === 1) {
stlControls.isDragging = true;
stlControls.previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}
}, { passive: true });
canvas.addEventListener("touchmove", e => {
if (!stlControls.isDragging || !stlMesh || e.touches.length !== 1) return;
const dx = e.touches[0].clientX - stlControls.previousMouse.x;
const dy = e.touches[0].clientY - stlControls.previousMouse.y;
stlControls.rotation.y += dx * 0.01;
stlControls.rotation.x += dy * 0.01;
stlControls.previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
canvas.addEventListener("touchend", () => stlControls.isDragging = false);
animateStl();
}
function animateStl() {
stlAnimId = requestAnimationFrame(animateStl);
if (stlMesh) {
if (!stlControls.isDragging) {
stlControls.rotation.y += 0.006;
}
stlMesh.rotation.x = stlControls.rotation.x;
stlMesh.rotation.y = stlControls.rotation.y;
}
if (stlRenderer && stlScene && stlCamera) {
stlRenderer.render(stlScene, stlCamera);
}
}
function loadStlFile(file) {
if (!file) return;
const name = file.name.toLowerCase();
if (!name.endsWith(".stl")) {
setStlStatus("Solo se aceptan archivos .STL", true);
return;
}
if (file.size > 60 * 1024 * 1024) {
setStlStatus("El archivo es demasiado grande (máx. 60 MB recomendado)", true);
return;
}
currentStlFile = file;
document.getElementById("stlFileName").textContent = file.name;
document.getElementById("stlFileSize").textContent = " — " + formatBytes(file.size);
document.getElementById("stlPreviewWrap").classList.add("visible");
setStlStatus("Cargando modelo…", false);
const reader = new FileReader();
reader.onload = function(e) {
try {
if (typeof THREE === "undefined" || !THREE.STLLoader) {
setStlStatus("Visor 3D no disponible en este entorno", true);
return;
}
const loader = new THREE.STLLoader();
const geometry = loader.parse(e.target.result);
geometry.computeBoundingBox();
const box = geometry.boundingBox;
const center = new THREE.Vector3();
box.getCenter(center);
geometry.translate(-center.x, -center.y, -center.z);
const size = new THREE.Vector3();
box.getSize(size);
const maxDim = Math.max(size.x, size.y, size.z);
const scale = 60 / maxDim;
geometry.scale(scale, scale, scale);
geometry.computeVertexNormals();
if (stlMesh) {
stlScene.remove(stlMesh);
stlMesh.geometry.dispose();
stlMesh.material.dispose();
}
const material = new THREE.MeshPhongMaterial({
color: 0x00e5ff,
specular: 0x111111,
shininess: 80,
flatShading: false
});
stlMesh = new THREE.Mesh(geometry, material);
stlScene.add(stlMesh);
stlControls.rotation = { x: -0.3, y: 0.4 };
stlCamera.position.set(0, 20, 90);
stlCamera.lookAt(0, 0, 0);
setStlStatus("Modelo cargado correctamente. Puedes rotarlo con el ratón.", false, true);
} catch (err) {
console.error(err);
setStlStatus("No se pudo leer el archivo STL. Verifica que sea válido.", true);
clearStlPreview();
}
};
reader.onerror = () => {
setStlStatus("Error al leer el archivo", true);
clearStlPreview();
};
reader.readAsArrayBuffer(file);
}
function clearStlPreview() {
currentStlFile = null;
document.getElementById("stlFile").value = "";
document.getElementById("stlPreviewWrap").classList.remove("visible");
setStlStatus("");
if (stlMesh && stlScene) {
stlScene.remove(stlMesh);
stlMesh.geometry.dispose();
stlMesh.material.dispose();
stlMesh = null;
}
}
function setStlStatus(msg, isError = false, isOk = false) {
const el = document.getElementById("stlStatus");
el.textContent = msg;
el.className = "stl-status" + (isError ? " error" : isOk ? " ok" : "");
}
function formatBytes(bytes) {
if (bytes < 1024) return bytes + " B";
if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}
const stlInput = document.getElementById("stlFile");
const dropZone = document.getElementById("stlDropZone");
stlInput.addEventListener("change", e => {
if (e.target.files && e.target.files[0]) loadStlFile(e.target.files[0]);
});
dropZone.addEventListener("dragover", e => {
e.preventDefault();
dropZone.classList.add("dragover");
});
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
e.preventDefault();
dropZone.classList.remove("dragover");
if (e.dataTransfer.files && e.dataTransfer.files[0]) {

document.getElementById("removeStlBtn").addEventListener("click", clearStlPreview);
const resizeObserver = new ResizeObserver(() => {
